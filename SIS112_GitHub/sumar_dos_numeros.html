<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora UCB</title>
  <style>
    :root {
      --ucb-blue: #002B49;
      --ucb-blue-light: #004B87;
      --ucb-yellow: #FFC72C;
      --ucb-yellow-hover: #e0ac1b;
      --bg-card: #ffffff;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--ucb-blue) 0%, #001528 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: var(--bg-card);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      border-top: 6px solid var(--ucb-yellow);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      color: var(--ucb-blue);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--ucb-blue);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--ucb-blue-light);
      box-shadow: 0 0 0 4px rgba(0, 75, 135, 0.15);
    }

    .btn-calculate {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--ucb-yellow);
      color: var(--ucb-blue);
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 199, 44, 0.3);
      margin-top: 0.5rem;
    }

    .btn-calculate:hover {
      background-color: var(--ucb-yellow-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 199, 44, 0.4);
    }

    .btn-calculate:active {
      transform: translateY(0);
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 1.2rem;
      border-radius: 10px;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      text-align: center;
      transition: all 0.3s ease;
    }

    .result-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .result-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--ucb-blue);
    }

    .pulse {
      animation: pulseAnim 0.3s ease;
      border-color: var(--ucb-yellow);
      background-color: #fffdf5;
    }

    @keyframes pulseAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Operación Suma</h1>
      <p>Universidad Católica Boliviana</p>
    </div>

    <div class="input-group">
      <label for="numA">Valor A</label>
      <input type="number" id="numA" placeholder="Ingresa un número">
    </div>

    <div class="input-group">
      <label for="numB">Valor B</label>
      <input type="number" id="numB" placeholder="Ingresa otro número">
    </div>

    <button class="btn-calculate" onclick="ejecutarSuma()">Calcular</button>

    <div class="result-box" id="resultBox">
      <div class="result-title">Resultado</div>
      <div class="result-value" id="resultado">0</div>
    </div>
  </div>

  <script>
    // --- Código base del usuario ---
    function suma(a, b) {
        return a + b;
    }
    // --------------------------------

    function ejecutarSuma() {
        const inputA = document.getElementById('numA').value;
        const inputB = document.getElementById('numB').value;
        
        // Conversión y validación simple
        const valA = parseFloat(inputA) || 0;
        const valB = parseFloat(inputB) || 0;
        
        // Ejecución de la función
        const res = suma(valA, valB);
        
        // Renderizado e interacción dinámica
        const resElem = document.getElementById('resultado');
        const resBox = document.getElementById('resultBox');
        
        resElem.textContent = res;
        
        // Reiniciar animación visual
        resBox.classList.remove('pulse');
        void resBox.offsetWidth; 
        resBox.classList.add('pulse');
    }
  </script>

</body>
</html>
